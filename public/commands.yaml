# Настройки команд. После изменения обновите страницу.
# shortcut: null отключает сочетание; модификаторы: ctrl, alt, shift, meta.
# Сочетания должны быть уникальны; буквы зависят от текущей раскладки.
commands:
  # Показывает или скрывает ручной ввод штрихкода; работает и внутри этого поля.
  barcodeToggle:
    label: 'Развернуть / свернуть ввод'
    shortcut: 'F2'
    description: 'Развернуть / свернуть ручной ввод штрихкода'

  # Показывает или скрывает историю; работает также в поле штрихкода.
  historyToggle:
    label: 'История'
    shortcut: 'F3'
    description: 'Развернуть / свернуть историю действий'

  # Отменяет ожидающую операцию; в поле штрихкода сначала сворачивает ввод.
  # Escape отдельно очищает непустой буфер сканирования без отмены операции.
  cancel:
    label: 'Отмена'
    shortcut: 'Escape'
    description: 'Отменить текущую операцию'

  # Сбрасывает фильтр источника; кнопка и сочетание доступны только при наличии фильтра.
  clearFilter:
    label: 'Сбросить'
    shortcut: 'x'
    description: 'Сбросить фильтр источника'

  # Возвращает список всех ТМ, сохраняя активное место как цель переноса.
  clearDestinationFilter:
    label: 'Сбросить'
    shortcut: 'shift+x'
    description: 'Сбросить фильтр транспортных мест'

  # Создаёт транспортное место, когда заказ загружен и нет выполняемой или ожидающей операции.
  createTransportPlace:
    label: 'Создать ТМ'
    shortcut: 'n'
    description: 'Создать новое транспортное место'

  # Открывает подтверждение удаления выбранного ТМ с возвратом его товаров.
  deleteTransportPlace:
    label: 'Удалить ТМ'
    shortcut: 'shift+n'
    description: 'Удалить выбранное ТМ с подтверждением и возвратом товаров'

  # Заглушка MIX: кнопка отключена, сочетание отображается, но действие пока не выполняется.
  mix:
    label: 'MIX'
    shortcut: 'm'
    description: 'Будет доступно в следующих версиях прототипа'

  # Заглушка PAL: кнопка отключена, сочетание отображается, но действие пока не выполняется.
  pal:
    label: 'PAL'
    shortcut: 'b'
    description: 'Будет доступно в следующих версиях прототипа'

  # Будущая печать этикетки ТМ; сейчас кнопка отключена и сочетание не выполняет действие.
  printLabel:
    label: 'Печать этикетки ТМ'
    shortcut: 't'
    description: 'Печать этикетки ТМ: будет доступно в следующих версиях прототипа'

  # Открывает выбор отчёта для печати; кнопки внутри диалога имеют собственные подписи.
  printReports:
    label: 'Печать'
    shortcut: 'p'
    description: 'Открыть выбор отчета для печати'

  # Будущее получение маркировок; сейчас кнопка отключена и сочетание не выполняет действие.
  receiveLabels:
    label: 'Получить маркировки'
    shortcut: 'l'
    description: 'Получить маркировки: будет доступно в следующих версиях прототипа'

  # Будущее получение SSCC; сейчас кнопка отключена и сочетание не выполняет действие.
  receiveSSCC:
    label: 'Получить SSCC'
    shortcut: 'c'
    description: 'Получить SSCC: будет доступно в следующих версиях прототипа'

  # Будущая повторная отправка; сейчас кнопка отключена и сочетание не выполняет действие.
  repeatShipment:
    label: 'Повторная отправка'
    shortcut: 'r'
    description: 'Повторная отправка: будет доступно в следующих версиях прототипа'

  # Возвращает все товары из активного ТМ в источник; доступность определяет рабочий процесс.
  returnAll:
    label: 'Вернуть всё из ТМ'
    shortcut: 'shift+a'
    description: 'Вернуть все товары из активного ТМ'

  # Открывает выбор количества для возврата выбранного товара из активного ТМ.
  returnQuantity:
    label: 'Вернуть количество'
    shortcut: 'shift+q'
    description: 'Выбрать количество для возврата из активного ТМ'

  # Возвращает выбранную товарную строку из активного ТМ в источник.
  returnRow:
    label: 'Вернуть строку'
    shortcut: 'shift+d'
    description: 'Вернуть выбранную строку из активного ТМ'

  # Будущая отправка ТМ в 1С; сейчас кнопка отключена и сочетание не выполняет действие.
  sendTo1C:
    label: 'Отправка ТМ в 1С'
    shortcut: 's'
    description: 'Отправка ТМ в 1С: будет доступно в следующих версиях прототипа'

  # Перемещает доступные товары по текущему фильтру источника в активное ТМ.
  transferAll:
    label: 'Переместить всё по фильтру'
    shortcut: 'a'
    description: 'Переместить все товары по текущему фильтру в активное ТМ'

  # Открывает выбор количества выбранного товара для перемещения в активное ТМ.
  transferQuantity:
    label: 'Переместить количество'
    shortcut: 'q'
    description: 'Выбрать количество для перемещения в активное ТМ'

  # Перемещает выбранный контейнер или товарную строку в активное ТМ, в зависимости от режима.
  transferRow:
    label: 'Переместить строку'
    shortcut: 'd'
    description: 'Переместить выбранную строку в активное ТМ'
